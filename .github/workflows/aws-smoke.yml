name: Messaging Runtime AWS Smoke

on:
  workflow_dispatch:
    inputs:
      suites:
        description: Comma-separated live AWS smoke suites
        required: true
        default: transport,worker,routing,discovery,queue-ops,redrive
        type: string
      aws-region:
        description: AWS region for temporary smoke fixtures
        required: true
        default: us-east-1
        type: string
      git-ref:
        description: Optional git ref or commit SHA to check out before running the smoke suites
        required: false
        default: ''
        type: string
  workflow_call:
    inputs:
      suites:
        description: Comma-separated live AWS smoke suites
        required: false
        default: transport,worker,routing,discovery,queue-ops,redrive
        type: string
      aws-region:
        description: AWS region for temporary smoke fixtures
        required: false
        default: us-east-1
        type: string
      git-ref:
        description: Optional git ref or commit SHA to check out before running the smoke suites
        required: false
        default: ''
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: messaging-runtime-aws-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  aws-smoke:
    name: Live AWS smoke
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ inputs['aws-region'] }}
      AWS_SMOKE_ROLE_ARN: ${{ vars.AWS_SMOKE_ROLE_ARN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs['git-ref'] != '' && inputs['git-ref'] || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Assert AWS smoke role is configured
        run: |
          test -n "$AWS_SMOKE_ROLE_ARN" || {
            echo "Configure AWS_SMOKE_ROLE_ARN as a repository or environment variable for the live AWS smoke workflow."
            exit 1
          }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_SMOKE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: messaging-runtime-aws-smoke

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run live AWS smoke
        run: npm run e2e:aws-smoke:ci -- --suite "${{ inputs.suites }}"
